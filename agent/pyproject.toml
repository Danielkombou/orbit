[project]
name = "orbit-agent"
version = "0.2.0"
description = "ORBIT Agent - AI agent with computer control, visual understanding, and voice"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "openai>=1.10.0",
    "anthropic>=0.39.0",
    "google-generativeai>=0.8.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "edge-tts>=6.1.0",
    "pyaudio>=0.2.14",
]

[project.scripts]
orbit-agent = "main:run"
